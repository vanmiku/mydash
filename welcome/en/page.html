<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A small web page</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, "PingFang SC", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { text-align: center; padding: 24px; }
  code { font-size: 14px; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, CanvasText 8%, transparent); }
  button { margin-top: 16px; font: inherit; font-size: 16px; padding: 10px 22px; border: 0; border-radius: 10px; background: #3355ff; color: #fff; cursor: pointer; }
  b { font-size: 40px; display: block; margin-top: 8px; }
</style></head>
<body><main>
  <p>This page runs on its own port: <code id="o"></code></p>
  <p>Clicks remembered by this page:</p><b id="n">0</b>
  <button id="b">Click</button>
</main>
<script>
  document.getElementById('o').textContent = location.origin;
  const get = () => { try { return Number(localStorage.getItem('clicks') || 0); } catch { return 0; } };
  const show = () => { document.getElementById('n').textContent = get(); };
  document.getElementById('b').onclick = () => { try { localStorage.setItem('clicks', get() + 1); } catch {} show(); };
  show();
</script>
</body></html>
